appId: io.github.ibrahimbouillet.drepanocytose
productName: La drépanocytose
copyright: Copyright © 2026 Ibrahim Bouillet
directories:
  output: release/${version}
files:
  - apps/desktop/main.cjs
  - apps/desktop/preload.cjs
  - apps/desktop/renderer.js
  - apps/desktop/preparation.js
  - apps/desktop/styles.css
  - apps/desktop/index.html
  - apps/desktop/assets/icon.ico
  - apps/desktop/assets/icon.png
  - presentations/drepanocytose/metadata.json
  - package.json
asar: true
npmRebuild: false
win:
  target:
    - target: portable
      arch:
        - x64
  icon: apps/desktop/assets/icon.ico
  requestedExecutionLevel: asInvoker
artifactName: Drepanocytose-${version}-Windows-${arch}.${ext}
portable:
  requestExecutionLevel: user
  unpackDirName: false
