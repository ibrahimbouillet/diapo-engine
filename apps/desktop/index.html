<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'" />
    <meta name="color-scheme" content="light" />
    <title></title>
    <link rel="stylesheet" href="styles.css" />
    <script src="renderer.js" type="module"></script>
  </head>
  <body data-screen="loading">
    <section id="loading" role="status" aria-label="Chargement de la présentation">
      <div class="bloodstream" aria-hidden="true">
        <span class="blood-cell blood-cell--one" data-kind="normal"></span>
        <span class="blood-cell blood-cell--two" data-kind="normal"></span>
        <span class="blood-cell blood-cell--sickle" data-kind="sickle">
          <img src="assets/icon.png" alt="" draggable="false" />
        </span>
        <span class="blood-cell blood-cell--three" data-kind="normal"></span>
        <span class="blood-cell blood-cell--four" data-kind="normal"></span>
      </div>
      <p class="loading-label">Chargement…</p>
    </section>
    <main id="presentation" aria-label="Présentation" hidden></main>
  </body>
</html>
