name: Core checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run validate
      - run: node --check apps/desktop/main.cjs
      - run: node --check apps/desktop/preload.cjs
      - run: node --check apps/desktop/renderer.js
      - run: node --check apps/desktop/preparation.js
      - run: node --check scripts/check-desktop.cjs
